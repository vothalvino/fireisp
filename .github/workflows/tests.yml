name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  caddy-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag fireisp-caddy:ci --file deploy/staging/Dockerfile.caddy .
      - name: Verify the compiled TLS runtime
        shell: bash
        run: docker run --rm fireisp-caddy:ci caddy build-info | python3 deploy/check_caddy.py
      - name: Validate the deployed HTTPS configuration
        run: docker run --rm --env STAGING_HOSTNAME=security-check.invalid --volume "$PWD/deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro" fireisp-caddy:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fireisp
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DEBUG: 'true'
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/fireisp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test --noinput
